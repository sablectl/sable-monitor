name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite is available without a flag from 24, which is the
        # floor the package declares. 26 is the current release.
        node: ['24', '26']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # The runner is a real Linux host with a real /proc, which is what
      # these need. They bind a loopback port chosen by the kernel.
      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Smoke test the build
        run: |
          set -eu
          node dist/bin/sable-monitor.js --version
          node dist/bin/sable-monitor.js --help > /dev/null
          node dist/bin/sable-monitor.js check > /dev/null

          node dist/bin/sable-monitor.js start \
            --port 7879 --interval 1000 --db "$RUNNER_TEMP/smoke.db" &
          agent=$!
          trap 'kill "$agent" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7879/api/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:7879/api/health
          curl -fsS http://127.0.0.1:7879/api/system > /dev/null
          curl -fsS http://127.0.0.1:7879/api/metrics/current > /dev/null
          curl -fsS 'http://127.0.0.1:7879/api/processes?limit=5' > /dev/null
          curl -fsS http://127.0.0.1:7879/ > /dev/null
          curl -fsS http://127.0.0.1:7879/main.js > /dev/null

          # A request naming a host this server does not answer to must be
          # refused: this is the DNS rebinding defence, in the real server.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Host: evil.example' http://127.0.0.1:7879/api/health)
          test "$status" = "403"

          # Nothing may change state.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:7879/api/health)
          test "$status" = "405"

          # SIGTERM must stop it cleanly.
          kill -TERM "$agent"
          wait "$agent" || true
          trap - EXIT

      - name: Benchmark
        run: npm run bench

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # There are no runtime dependencies, so the first of these should
      # always have nothing to report. It is here to notice if one appears.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Audit all dependencies
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The official action infers a base and head from the event, which
      # has no meaning for the first push to a repository and makes it
      # fail for a reason unrelated to secrets. The pinned container scans
      # the whole history directly, which behaves the same on every event.
      - name: Scan full history for verified secrets
        run: |
          set -eu
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/trufflesecurity/trufflehog:3.90.8 \
            git file:///repo --results=verified --fail --no-update
