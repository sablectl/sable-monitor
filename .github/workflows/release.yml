name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run verify

      - name: Create reproducible tarball and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          name="sable-monitor-${TAG}"
          mkdir -p out
          # There are no runtime dependencies, so the tarball is the built
          # output and the documents that must travel with it. Nothing has
          # to be installed before it will run.
          files="dist package.json"
          for f in README.md LICENSE CHANGELOG.md; do
            if [ -f "$f" ]; then
              files="$files $f"
            else
              echo "::warning::$f not found, not included in tarball"
            fi
          done
          # Fixed mtime, ownership and order, and no gzip timestamp, so
          # the same tag always produces the same bytes.
          mtime=$(git log -1 --format=%cI)
          # shellcheck disable=SC2086
          tar --sort=name --mtime="$mtime" --owner=0 --group=0 \
            --numeric-owner --transform "s,^,${name}/," \
            -cf - $files | gzip -n -9 > "out/${name}.tar.gz"
          (cd out && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          cat "out/${name}.tar.gz.sha256"

      - name: Check the packaged artefact in a clean directory
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          name="sable-monitor-${TAG}"
          work=$(mktemp -d)
          tar -xzf "out/${name}.tar.gz" -C "$work"
          cd "$work/${name}"

          node dist/bin/sable-monitor.js --version
          node dist/bin/sable-monitor.js --help > /dev/null

          node dist/bin/sable-monitor.js start \
            --port 7880 --interval 1000 --db "$work/metrics.db" &
          agent=$!
          trap 'kill "$agent" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7880/api/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:7880/api/health
          curl -fsS http://127.0.0.1:7880/ > /dev/null
          curl -fsS http://127.0.0.1:7880/main.js > /dev/null

          kill -TERM "$agent"
          wait "$agent" || true
          trap - EXIT

          cd - > /dev/null
          rm -rf "$work"

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/
          if-no-files-found: error

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The release notes live in the repository, so this job needs a
      # checkout of its own. Only that directory is fetched.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out
      - name: Verify checksum
        run: cd out && sha256sum -c ./*.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" out/* \
            --repo "$REPO" --title "Sable Monitor $TAG" \
            --notes-file .github/release-notes/"$TAG".md --verify-tag
